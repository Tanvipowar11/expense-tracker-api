spring.application.name=expense-tracker-api

# Default: in-memory H2 so the app runs with zero setup
spring.datasource.url=jdbc:h2:mem:expensedb
spring.jpa.hibernate.ddl-auto=update

# JWT: secret must be at least 32 characters. Override with the JWT_SECRET env variable in real use.
app.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-123456}
app.jwt.expiration-ms=3600000
server.port=8081